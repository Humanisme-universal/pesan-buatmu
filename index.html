<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ada Kejutan Spesial Buat Kamu! 🎁</title>

    <!-- Meta Tag Penyamaran untuk Preview WhatsApp -->
    <meta property="og:title" content="Ada Pesan Spesial Buat Kamu! ✨" />
    <meta property="og:description" content="Coba buka deh, ada sesuatu yang ingin aku sampaikan khusus buat kamu..." />
    <meta property="og:image" content="https://images.unsplash.com/photo-1518199266791-5375a83190b7?q=80&w=600&auto=format&fit=crop" />

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #1a0826 0%, #3a1c40 50%, #5c2547 100%);
            overflow: hidden;
            position: relative;
            color: #fff;
        }

        /* Partikel Kelopak Bunga */
        .petal {
            position: absolute;
            background-color: #ff4d6d;
            border-radius: 15px 0 15px 0;
            opacity: 0.7;
            pointer-events: none;
            animation: fall linear infinite;
        }

        @keyframes fall {
            0% {
                transform: translateY(-10vh) rotate(0deg) scale(0.8);
                opacity: 1;
            }
            100% {
                transform: translateY(105vh) rotate(360deg) scale(1.2);
                opacity: 0.2;
            }
        }

        /* Card Utama */
        .card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 2.5rem 1.8rem;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            text-align: center;
            max-width: 90%;
            width: 380px;
            z-index: 10;
        }

        .icon-heart {
            font-size: 3.5rem;
            margin-bottom: 0.8rem;
            display: inline-block;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.18); }
            100% { transform: scale(1); }
        }

        h1 {
            font-size: 1.7rem;
            font-weight: 700;
            margin-bottom: 0.8rem;
            color: #fff0f5;
            text-shadow: 0 0 10px rgba(255, 182, 193, 0.5);
            line-height: 1.3;
        }

        p {
            font-size: 0.95rem;
            color: #ffe4e1;
            margin-bottom: 2rem;
            line-height: 1.5;
        }

        /* Container Tombol */
        .buttons-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            width: 100%;
            min-height: 60px;
            position: relative;
        }

        .btn {
            padding: 12px 24px;
            font-size: 1rem;
            font-weight: 600;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        .btn-yes {
            background: linear-gradient(45deg, #ff416c, #ff4b2b);
            color: white;
            position: relative;
            z-index: 2;
        }

        .btn-no {
            background: rgba(255, 255, 255, 0.25);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.4);
            position: relative;
            z-index: 5;
            transition: top 0.2s ease, left 0.2s ease;
        }

        /* Modal Popup */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(8px);
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        .modal-content {
            background: linear-gradient(135deg, #ffffff 0%, #fff0f5 100%);
            color: #333;
            padding: 2.2rem 1.8rem;
            border-radius: 24px;
            max-width: 85%;
            width: 350px;
            text-align: center;
            box-shadow: 0 25px 50px rgba(0,0,0,0.5);
        }

        .modal-content h2 {
            color: #d63384;
            font-size: 1.6rem;
            margin-bottom: 0.8rem;
        }

        .modal-content p {
            color: #555;
            font-size: 0.95rem;
            margin-bottom: 1.5rem;
        }

        .celebrate-emoji {
            font-size: 3rem;
            margin-bottom: 0.5rem;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="icon-heart">💖</div>
        <h1>Will you marry me, darling? 💍</h1>
        <p>Setiap detik bersamamu adalah kebahagiaan. Maukah kamu berjalan bersamaku selamanya?</p>
        
        <div class="buttons-wrapper">
            <button class="btn btn-yes" onclick="acceptProposal()">Yes! 💖</button>
            <button class="btn btn-no" id="noBtn" onmouseover="moveButton()" onclick="moveButton()" ontouchstart="moveButton(event)">No 😜</button>
        </div>
    </div>

    <!-- Modal Jawaban Yes -->
    <div class="modal" id="loveModal">
        <div class="modal-content">
            <div class="celebrate-emoji">🎉👩‍❤️‍💋‍👨💐</div>
            <h2>I Love You So Much! ❤️</h2>
            <p>Terima kasih sudah memilihku! Kamu telah membuat hari ini menjadi hari paling bahagia dalam hidupku! 💍✨</p>
            <button class="btn btn-yes" onclick="closeModal()">Peluk Jauh 🤗</button>
        </div>
    </div>

    <script>
        // Efek Kelopak Bunga
        function createPetal() {
            const petal = document.createElement('div');
            petal.classList.add('petal');
            
            const size = Math.random() * 14 + 8;
            petal.style.width = `${size}px`;
            petal.style.height = `${size}px`;
            petal.style.left = `${Math.random() * 100}vw`;
            petal.style.animationDuration = `${Math.random() * 3 + 3}s`;
            
            document.body.appendChild(petal);

            setTimeout(() => {
                petal.remove();
            }, 6000);
        }

        setInterval(createPetal, 300);

        // Fungsi Tombol No Kabur
        const noBtn = document.getElementById('noBtn');

        function moveButton(e) {
            if (e) e.preventDefault();
            
            const padding = 30;
            const maxX = window.innerWidth - noBtn.offsetWidth - padding;
            const maxY = window.innerHeight - noBtn.offsetHeight - padding;

            const randomX = Math.max(padding, Math.floor(Math.random() * maxX));
            const randomY = Math.max(padding, Math.floor(Math.random() * maxY));

            noBtn.style.position = 'fixed';
            noBtn.style.left = `${randomX}px`;
            noBtn.style.top = `${randomY}px`;
        }

        // Jawaban Yes
        function acceptProposal() {
            document.getElementById('loveModal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('loveModal').style.display = 'none';
        }
    </script>
</body>
</html>
