<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ada Kejutan Spesial Buat Kamu! 🎁</title>

    <!-- Meta Tag Penyamaran untuk Preview WhatsApp -->
    <meta property="og:title" content="Ada Pesan Spesial Buat Kamu! ✨" />
    <meta property="og:description" content="Coba buka deh, ada sesuatu yang ingin aku sampaikan khusus buat kamu..." />
    <meta property="og:image" content="https://images.unsplash.com/photo-1518199266791-5375a83190b7?q=80&w=600&auto=format&fit=crop" />

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #1a0826 0%, #3a1c40 50%, #5c2547 100%);
            overflow: hidden;
            position: relative;
            color: #fff;
        }

        /* Partikel Hati & Bunga Berjatuhan */
        .petal {
            position: absolute;
            background-color: #ff4d6d;
            border-radius: 15px 0 15px 0;
            opacity: 0.7;
            pointer-events: none;
            animation: fall linear infinite;
        }

        @keyframes fall {
            0% {
                transform: translateY(-10vh) rotate(0deg) scale(0.8);
                opacity: 1;
            }
            100% {
                transform: translateY(105vh) rotate(360deg) scale(1.2);
                opacity: 0.2;
            }
        }

        /* Card Utama */
        .card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 2.5rem 2rem;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            text-align: center;
            max-width: 90%;
            width: 420px;
            z-index: 10;
            animation: fadeIn 1.5s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .icon-heart {
            font-size: 3.5rem;
            margin-bottom: 1rem;
            display: inline-block;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.18); }
            100% { transform: scale(1); }
        }

        h1 {
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 1rem;
            color: #fff0f5;
            text-shadow: 0 0 10px rgba(255, 182, 193, 0.5);
            line-height: 1.3;
        }

        p {
            font-size: 1rem;
            color: #ffe4e1;
            margin-bottom: 2rem;
            line-height: 1.5;
        }

        .buttons {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 1.2rem;
            position: relative;
            min-height: 50px;
        }

        .btn {
            padding: 12px 28px;
            font-size: 1.05rem;
            font-weight: 600;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .btn-yes {
            background: linear-gradient(45deg, #ff416c, #ff4b2b);
            color: white;
        }

        .btn-yes:hover {
            transform: scale(1.08);
            box-shadow: 0 6px 20px rgba(255, 65, 108, 0.5);
        }

        .btn-no {
            background: rgba(255, 255, 255, 0.2);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.4);
            position: absolute;
            transition: all 0.2s ease;
        }

        /* Modal Surat Cinta */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(8px);
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        .modal-content {
            background: linear-gradient(135deg, #ffffff 0%, #fff0f5 100%);
            color: #333;
            padding: 2.5rem;
            border-radius: 20px;
            max-width: 90%;
            width: 400px;
            text-align: center;
            box-shadow: 0 25px 50px rgba(0,0,0,0.5);
            animation: popUp 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes popUp {
            from { transform: scale(0.5); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .modal-content h2 {
            color: #d63384;
            font-size: 1.8rem;
            margin-bottom: 1rem;
        }

        .modal-content p {
            color: #555;
            font-size: 1.05rem;
            margin-bottom: 1.5rem;
        }

        .celebrate-emoji {
            font-size: 3rem;
            margin-bottom: 0.5rem;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="icon-heart">💖</div>
        <h1>Will you marry me, darling? 💍</h1>
        <p>Setiap detik bersamamu adalah kebahagiaan. Maukah kamu berjalan bersamaku selamanya?</p>
        
        <div class="buttons">
            <button class="btn btn-yes" onclick="acceptProposal()">Yes! 💖</button>
            <button class="btn btn-no" id="noBtn" onmouseover="moveButton()" onclick="moveButton()">No 😜</button>
        </div>
    </div>

    <!-- Modal Jawaban "Yes" -->
    <div class="modal" id="loveModal">
        <div class="modal-content">
            <div class="celebrate-emoji">🎉👩‍❤️‍💋‍👨💐</div>
            <h2>I Love You So Much! ❤️</h2>
            <p>Terima kasih sudah memilihku! Kamu telah membuat hari ini menjadi hari paling bahagia dalam hidupku! 💍✨</p>
            <button class="btn btn-yes" onclick="closeModal()">Peluk Jauh 🤗</button>
        </div>
    </div>

    <script>
        // Efek Kelopak Bunga Berjatuhan
        function createPetal() {
            const petal = document.createElement('div');
            petal.classList.add('petal');
            
            const size = Math.random() * 15 + 10;
            petal.style.width = `${size}px`;
            petal.style.height = `${size}px`;
            petal.style.left = `${Math.random() * 100}vw`;
            petal.style.animationDuration = `${Math.random() * 3 + 3}s`;
            
            document.body.appendChild(petal);

            setTimeout(() => {
                petal.remove();
            }, 6000);
        }

        setInterval(createPetal, 300);

        // Tombol "No" Kabur jika Didekati/Disentuh
        const noBtn = document.getElementById('noBtn');
        let isMoved = false;

        function moveButton() {
            const x = Math.random() * (window.innerWidth - noBtn.offsetWidth - 100);
            const y = Math.random() * (window.innerHeight - noBtn.offsetHeight - 100);
            
            noBtn.style.position = 'fixed';
            noBtn.style.left = `${x}px`;
            noBtn.style.top = `${y}px`;
        }

        // Jalankan saat diklik "Yes"
        function acceptProposal() {
            document.getElementById('loveModal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('loveModal').style.display = 'none';
        }
    </script>
</body>
</html>
